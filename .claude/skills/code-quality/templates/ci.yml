name: CI

# Template: .claude/skills/code-quality/templates/ci.yml in UAMS-Web/uams-claude-skills,
# copied to .github/workflows/ci.yml. Fill the placeholders below, then delete this
# header paragraph. The code-quality skill and the tests skill say what each job runs.
#
# - PHP version: `.github/actions/setup/action.yml` defaults to 8.4. Change its `default`
#   to the floor the repository supports.
# - Commands: the jobs call `composer test:pint`, `composer test:refactor`, `composer stan` and
#   `composer test`. Rename
#   a command here to match the repository's own Composer script when it differs.
# - Skip-baseline band: the `pest` job's skip-baseline step reads the `suite` entry of
#   `tests/skip-baseline.json`. A repository whose baseline names another band (`parallel`
#   where `composer test` runs `pest --parallel`) adds `--band=<name>` to that step, and to
#   the slowest-class step so its output names the same band.
# - Slowest-class ceilings: `--share-ceiling=25 --ceiling=900` are starting points, not
#   measurements. Set both from the repository's own suite, as the pest-testing skill says.
#   A small suite (a few seconds over few classes) has one class over any low share, so it
#   sets `--share-ceiling=100` and keeps the backstop. Update the step's comment to the values
#   chosen.
# - Jobs the repository does not need (a repository with no Pest suite yet drops `pest`) are
#   deleted along with the `needs:` entry that names them.
#
# The synced-files job runs the check that fails when a rule or skill the sync manages was
# edited by hand. It sits beside the quality gate because the two answer different questions:
# whether the code is sound, and whether the shared guidance is intact. The local CI runner
# runs the same check as a `synced-files` job in local-ci.json.
#
# The no-emoji job sweeps the prose the no-emoji-in-durable-records rule names (.claude/, docs/,
# README.md, AGENTS.md, CLAUDE.md) with the script the writing-comments skill ships. It is
# self-contained: it needs nothing but Node and the synced rule, so it stands outside the
# quality chain; the `CI` job at the end still waits for it.
#
# The mutate-ignore job runs the pest-testing skill's check for `@pest-mutate-ignore`
# annotations that suppress nothing, or suppress everything. It reads the installed
# pest-plugin-mutate, so it needs the locked install and belongs only in a repository that
# runs Pest's `--mutate`; a repository without it drops the job. Do not add a second copy
# of the check as a Composer script and a job.
#
# The mutate job runs the mutation score for a repository whose Pest suite meets the Full
# coverage bar (a Statamic add-on's `composer mutate` script is `pest --mutate --path=src`).
# It installs PCOV through the setup action's `coverage` input, because `--mutate` without a
# coverage driver either errors or reports `0 Mutations for 0 Files created`, and it fails on
# a run that created no mutants as well as on any untested, uncovered or timed-out mutant.
# On a pull request it mutates only the PHP files the pull request adds or changes under the
# job's MUTATE_PATHS (set it to the paths `composer mutate` passes to `--path`), and passes
# with the reason printed when there are none; a push mutates everything the script covers.
# A repository without a `mutate` Composer script, or without the patched pest-plugin-mutate,
# drops the job. The code-quality skill says how to adopt it.
#
# The pest job writes a JUnit report and runs the pest-testing skill's two checks on it: the
# skipped-test count against `tests/skip-baseline.json` (a file the repository keeps; the skill
# describes its shape) and the costliest class. A repository without a skip baseline yet, or
# whose Pest suite is not in this job, drops the two check steps and keeps the plain step.
#
# The pest job's "Global test symbols" step runs the pest-testing skill's check for a global
# `const` or `function` declared in more than one Pest file, and for a no-op `use X;` import in a
# file with no namespace. It is optional for a repository that does not run `pest --parallel`:
# both defects fail a serial run on its first execution, where the author sees them, and only a
# parallel run turns them into a failure that depends on how files land on workers. Such a
# repository deletes the step. The guard's other parallel-safety rules (a faked storage disk, a
# hardcoded `framework/testing` path) stay with the application that owns them; the pest-testing
# skill says why.
#
# Jobs are chained with `needs:`, cheapest first, so a pull request that fails a cheap check
# does not spend minutes on the dear ones.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` every
# other job in this file, runs `if: always()`, and fails unless every needed job reports
# `success`: a `skipped` or `cancelled` job fails it. A ruleset therefore never lists a job
# by name, and renaming or adding a job changes only the `needs:` list of `CI`. Adding a job
# without adding it to that list leaves it running but not required; the aggregate-needs job
# below runs the code-quality skill's check-aggregate-needs.mjs and fails the pull request when
# that happens, and scripts/check-templates.mjs in UAMS-Web/uams-claude-skills fails the template.
# Do not rename `CI`.
#
# Private repositories pay for runner minutes. A repository that gates its Actions jobs on a
# `RUN_REMOTE_CI` variable adds `if: vars.RUN_REMOTE_CI == 'true'` to each job, `CI` included.
# Measured on 2026-10-22 in a private UAMS-Web repository with the variable unset, on a
# scratch workflow of two gated jobs and two aggregates (UAMS-Web/uams-claude-skills#289):
#
#   a gated job                                 skipped
#   `CI` with `if: always() && vars...`         skipped (passes a required check per GitHub docs; not measured)
#   `CI` with `if: always()`, no gate          ran, reported failure (its needed jobs were skipped)
#
# The check for the run with no gate read `queued` for about eight minutes after its job had finished,
# so read a check's conclusion from the job, not from the first poll of the check run.
#
# So with the switch off a gated `CI` lets a pull request merge without any job having run,
# and a `CI` without the gate fails every pull request. Neither is a gate. Require `CI` only in a
# repository where this workflow genuinely runs on every pull request; the pre-merge-check
# rule says the same. In a repository that keeps the switch, gate `CI` the same way as the
# jobs, and do not require it while the switch is off.
#
# The shared setup (PHP, the Composer cache, the locked install) lives in
# `.github/actions/setup/action.yml`, a composite action copied from
# `.claude/skills/code-quality/templates/setup-action.yml`. `dependabot.yml` covers that
# directory so the actions it references are kept current.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  synced-files:
    name: Synced files (no hand-edited rules or skills)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  no-emoji:
    name: No emoji in durable records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, line and code point, when prose carries a banned glyph.
      - run: node .claude/skills/writing-comments/scripts/check-no-emoji.mjs

  aggregate-needs:
    name: Aggregate needs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job is missing from the `needs:` list of `CI` or a
      # fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  pint:
    name: Pint
    needs: [composer-validate, synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector
    needs: [pint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: PHPStan
    needs: [pint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer stan

  mutate-ignore:
    name: Mutation annotations (none inert)
    needs: [pint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Fails, naming the file and line, on a bare marker, a tail that names no mutator,
      # prose after a mutator list, and (on a CRLF runtime) a trailing marker. Prints the
      # plugin revision its parsing model was measured against.
      - run: php .claude/skills/pest-testing/scripts/check-mutate-ignore.php

  mutate:
    name: Mutation score (changed files, with PCOV)
    needs: [rector, phpstan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # An explicit `bash` runs each step with `-eo pipefail`; the default, `bash -e`, does not,
    # and the run step's `| tee` would then report tee's status in place of Pest's.
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2: on a pull request the checkout is GitHub's merge commit, and its first parent
      # is the base branch it was merged onto.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          coverage: pcov

      # On a pull request, mutate only the PHP files under MUTATE_PATHS that the pull request
      # adds, changes or renames. They are read from the merge commit against its first parent,
      # so a later change on the base branch is not counted. A pull request that changes none
      # passes with the reason printed. A push mutates everything `composer mutate` covers.
      # Set MUTATE_PATHS to the paths that script passes to `--path` (a Statamic add-on's is
      # `src`), space-separated.
      - name: Select the files to mutate
        id: select
        env:
          EVENT: ${{ github.event_name }}
          MUTATE_PATHS: src
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: mutating everything composer mutate covers."
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::HEAD is not a merge commit, so the pull request's changes cannot be read."
            exit 1
          fi
          # NUL-separated, so a name git would quote (non-ASCII, a tab) is read as it is
          list=$(mktemp)
          git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- $MUTATE_PATHS > "$list"
          files=()
          while IFS= read -r -d '' f; do
            [[ "$f" == *.php ]] || continue
            if [[ "$f" == *,* || "$f" == *$'\n'* ]]; then
              echo "::error::A changed path holds a comma or a newline, which --path cannot carry: $f"
              exit 1
            fi
            files+=("$f")
          done < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No PHP file under $MUTATE_PATHS is added or changed by this pull request, so there is nothing to mutate."
            exit 0
          fi
          echo "Mutating ${#files[@]} changed file(s):"
          printf '%s\n' "${files[@]}"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "paths=$(IFS=,; echo "${files[*]}")" >> "$GITHUB_OUTPUT"

      # `--min=100` makes Pest fail the step on any survivor. The run is kept in a log
      # because a run that mutated nothing is a setup failure that Pest's exit status
      # reports or not depending on its version and `ignore_min_score_on_zero_mutations`.
      # Bash runs this step with pipefail, so `tee` does not hide Pest's status. A later
      # `--path` replaces the one `composer mutate` passes. On changed files, zero mutants is
      # left to the check step, so Pest is told not to fail it.
      - name: Run mutation testing
        if: steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PATHS: ${{ steps.select.outputs.paths }}
        run: |
          if [ "$MODE" = "changed" ]; then
            composer mutate -- --min=100 --ignore-min-score-on-zero-mutations --path="$PATHS" 2>&1 | tee mutate.log
          else
            composer mutate -- --min=100 2>&1 | tee mutate.log
          fi

      # Reads the log, not the exit status: fails on zero mutants, and on any untested,
      # uncovered, pending or timed-out mutant. Runs even when the step above failed, so the
      # log's own account of the failure is printed; skipped only when nothing was selected.
      # One exception: changed files that exist, mutated with PCOV loaded, that produce zero
      # mutants hold no code a mutator changes (an interface, say), which is a pass. Zero
      # mutants on a full run, or with no PCOV, still fails.
      - name: Check the mutation run
        if: always() && steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
        run: |
          if [ "$MODE" = "changed" ] && sed "s/$(printf '\033')\[[0-9;]*m//g" mutate.log | grep -Eq '(^|[^0-9])0 Mutations for 0 Files created' \
            && php -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'; then
            echo "The changed files produced no mutants: they hold no code a mutator changes, so there is nothing to test."
            exit 0
          fi
          php .claude/skills/pest-testing/scripts/check-mutation-run.php mutate.log

  pest:
    name: Pest
    needs: [rector, phpstan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Optional: delete this step in a repository that does not run `pest --parallel`.
      - name: Global test symbols
        run: php .claude/skills/pest-testing/scripts/check-global-test-symbols.php tests

      # `composer test` passes the extra argument to Pest, which writes the JUnit report the two
      # checks below read. The checks run after the tests whether or not they passed, but not on
      # a cancelled run, so a test failure is reported by the tests and a missing or empty
      # report is reported by the checks.
      - name: Pest
        run: composer test -- --log-junit=junit.xml

      # Fails when more tests were skipped than tests/skip-baseline.json records.
      - name: Skip baseline
        if: ${{ !cancelled() }}
        run: php .claude/skills/pest-testing/scripts/check-skip-baseline.php --report=junit.xml --baseline=tests/skip-baseline.json

      # Fails when one class takes over 25 percent of the summed class time, or over 900 seconds.
      - name: Slowest class
        if: ${{ !cancelled() }}
        run: php .claude/skills/pest-testing/scripts/check-slowest-class.php --report=junit.xml --share-ceiling=25 --ceiling=900

  # The one check a ruleset requires from this workflow. Keep `needs:` listing every other
  # job in the file; scripts/check-templates.mjs in UAMS-Web/uams-claude-skills checks it.
  ci:
    name: CI
    needs: [composer-validate, synced-files, no-emoji, aggregate-needs, pint, rector, phpstan, mutate-ignore, mutate, pest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
