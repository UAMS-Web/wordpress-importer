# Weekly version updates (wordpress-importer-archive#1324). Security updates are enabled at the
# organization level and do not depend on this file.
#
# composer resolves the private uams-web/wordpress-wxr-cleanup through the
# organization-level Dependabot access grant, so no registry is declared here.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
